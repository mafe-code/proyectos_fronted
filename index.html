
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Color RGB</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body id="fondo">

  <div class="tarjeta">

    <p class="etiqueta">Rojo (R)</p>
    <input type="range" id="r" min="0" max="255" value="23">
    <p id="numR" class="numero">23</p>

    <p class="etiqueta">Verde (G)</p>
    <input type="range" id="g" min="0" max="255" value="41">
    <p id="numG" class="numero">41</p>

    <p class="etiqueta">Azul (B)</p>
    <input type="range" id="b" min="0" max="255" value="56">
    <p id="numB" class="numero">56</p>

    <p id="hexVal" class="hex">#17293B</p>

  </div>

  <script src="color.js"></script>
</body>
</html>
