<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="img/png" href="./IMG/carita.png">
    <title>To Do List</title>
</head>
<body>
     <img class="logo" src="./IMG/Logomafe.jpg">
     <h1>Tareas Diarias </h1>

     <form action="#" id="userImpur">
        <input type="text" placeholder="Ingresa tus tareas">
        <input type="submit" value="+" id="addButton">
        <div id="listContainer">
            <div class="task-container" id="1">
                <input type="checkbox">
                <label> Tarea 1</label>
                <img src="./IMG/basurero.png" class="closeBtn">
            </div>
        </div>
                 
     </form>
     <div id="stats">
            Tareas Pendientes: 1 Tareas Completadas: 0
        </div> 
</body>
<script src="main.js"></script>
</html>
